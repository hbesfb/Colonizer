[program:colonizer-hw-with-app-in-k8s]
directory=/app/Colonizer
command=/app/Colonizer/venv/bin/python3 -m hwlayer.server
user=colonizer
autostart=true
autorestart=true
stderr_logfile=/var/log/colonizer-hw.err.log
stdout_logfile=/var/log/colonizer-hw.out.log

# ------------------------------------------------------------
# IMPORTANT: Use this program ONLY when the Flask app runs in K8s.
#
# In this mode, the Pi must expose the hardware server over TCP
# so that the Kubernetes pod can reach it via:
#   tcp://external-pi-service.colonizer.svc.cluster.local:3117
#
# Therefore we MUST set:
#   HARDWARE_TRANSPORT=tcp
#   HARDWARE_PORT=3117
#
# The hardware server will bind to:
#   tcp://*:3117
#
# And the K8s Deployment will connect using HARDWARE_ADDR from the ConfigMap.
# ------------------------------------------------------------
environment=HARDWARE_TRANSPORT="tcp",HARDWARE_PORT="3117"

# ------------------------------------------------------------
# To enable this mode on the Pi:
#   sudo supervisorctl stop colonizer-hw
#   sudo supervisorctl start colonizer-hw-with-app-in-k8s
#
# To check status:
#   sudo supervisorctl status
# ------------------------------------------------------------