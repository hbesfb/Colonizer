[program:colonizer-hw]
directory=/app/Colonizer
command=/app/Colonizer/venv/bin/python3 -m hwlayer.server
user=colonizer
autostart=true
autorestart=true
stderr_logfile=/var/log/colonizer-hw.err.log
stdout_logfile=/var/log/colonizer-hw.out.log

# ------------------------------------------------------------
# IMPORTANT: Use this program when the Flask app runs locally on the Pi.
#
# In this mode, the hardware server should use IPC (default):
#   HARDWARE_TRANSPORT defaults to "ipc"
#
# The server binds to:
#   ipc:///tmp/settleplate_hw
#
# And the local Flask app connects using the same IPC address.
# ------------------------------------------------------------
# No environment variables needed — defaults have been correctly set
# in client.py and server.py for this mode. ie
# - hardware_addr = os.environ.get("HARDWARE_ADDR", "localhost")
# - transport = os.environ.get("HARDWARE_TRANSPORT", "ipc")
# - hardware_port = os.environ.get("HARDWARE_PORT", "3117")
# - in server.py, binding is to ZeroMQ IPC socket at path ipc:///tmp/settleplate_hw
# - in client.py, default IPC connection address is the same IPC socket at ipc:///tmp/settleplate_hw
#
# To enable this mode on the Pi:
#   sudo supervisorctl stop colonizer-hw-with-app-in-k8s
#   sudo supervisorctl start colonizer-hw
# ------------------------------------------------------------